name: Auto Generate English Podcast

on:
  schedule:
    #周一/三/五 UTC 2:00 = 北京时间 10:00
    - cron: '0 2 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: osp-podcast-en-generate
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg rsync
          pip install feedparser openai ffmpeg-python

      - name: Check new articles
        id: check
        run: python scripts/check_articles.py

      - name: Commit queue to git
        if: steps.check.outputs.has_new == 'true'
        run: |
          git add -f last_article.json
          git commit -m "chore: article queue" || true
          git push origin main || true

      - name: Generate podcast (Fish Audio TTS)
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: agnes-2.0-flash
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          python scripts/generate_podcast.py --auto \
            --model "$LLM_MODEL" \
            --base-url "$LLM_BASE_URL"

      - name: Update RSS
        run: python scripts/update_rss.py

      - name: Generate index.html
        run: python scripts/generate_index.py

      - name: Prepare pages files
        run: |
          mkdir -p docs/episodes
          cp feed.xml docs/
          cp index.html docs/
          rsync -a episodes/ docs/episodes/
          rsync -a --include='episode_*.json' --exclude='*' episodes/ docs/

      - name: Commit new episodes to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/*.mp3 episodes/*.json docs/index.html docs/feed.xml
          git diff --cached --quiet || git commit -m "chore: add new podcast episodes $(date +%Y-%m-%d)"
          git push origin main || true

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
